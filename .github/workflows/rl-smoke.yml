name: RL smoke validation
on:
  push:
    paths:
      - 'rl_finetune.py'
      - 'rl_compare.py'
      - 'rnn_inference.py'
      - 'app.py'
      - 'data/BRD4_modeling_cohort.csv'
      - '.github/workflows/rl-smoke.yml'
  workflow_dispatch:
jobs:
  rl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Streamlit source and train real REINFORCE update
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile app.py rl_finetune.py rnn_inference.py
          python - <<'PY'
          import pandas as pd
          import torch
          from rnn_inference import load_generator, generate
          from rl_finetune import reinforce
          torch.set_num_threads(2)
          reference = pd.read_csv('data/BRD4_modeling_cohort.csv')['isomeric_smiles'].dropna().astype(str).tolist()
          model = load_generator('models/BRD4_generated.trained.pt')
          before = {k:v.detach().clone() for k,v in model.state_dict().items()}
          tuned, history = reinforce(model, reference, steps=30, batch_size=32, max_length=100, seed=2026)
          assert len(history) == 30
          assert all(0 <= h['Mean reward'] <= 1 for h in history)
          assert any(not torch.equal(before[k],tuned.state_dict()[k]) for k in before), 'RL weights unchanged'
          molecules, stats = generate(tuned,count=100,max_length=100,seed=2027)
          assert stats['requested'] == 100
          print('REINFORCE VALIDATED', history, stats)
          PY
      - name: Compare pretrained versus REINFORCE across paired seeds
        env:
          OMP_NUM_THREADS: '2'
        run: python rl_compare.py
      - name: Upload reproducible comparison and training history
        uses: actions/upload-artifact@v4
        with:
          name: panbrida-rl-benchmark
          path: |
            rl_comparison.csv
            rl_training_history.csv
